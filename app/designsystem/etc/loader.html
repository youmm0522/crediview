<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>크레디뷰 Design System - Stepper</title>
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content"
    />
    <link rel="stylesheet" href="https://youmm0522.github.io/techfin-static/static/crediview/crediview-m/css/designsystem.css" />
  </head>
  <body>
    <div class="comp-inner-root">
      <div class="comp-top">
        <h2 class="comp-pagetitle">Loader</h2>
        <p class="comp-pagetitle-desc">Loader 컴포넌트</p>
        <button type="button" class="comp-btn-code" onclick="openCode()">Code View</button>
      </div>

      <div id="compContents">
        <section class="comp-section">
          <h3 class="comp-objtitle">Default Loader</h3>

          <div class="SOLLoader-root"><i class="SOLIcon-root SOLIcon-loader s--lg"></i></div>
        </section>
      </div>
    </div>

    <!-- code view -->
    <script src="/app/js/highlight.min.js"></script>
    <script src="/app/js/go.min.js"></script>
    <script src="/app/js/codeview.js"></script>
    <script>
      hljs.highlightAll();
    </script>

    <!-- component js -->
    <script src="/app/js/popper.min.js"></script>
    <script src="/app/js/tippy-bundle.umd.js"></script>
    <script src="/app/js/custom.js"></script>
  </body>
</html>
